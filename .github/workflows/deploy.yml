name: OPT manual deployment

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Preview first; select deploy only to publish changes"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - deploy

permissions:
  contents: read

concurrency:
  group: opt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.deploy_mode == 'preview' && 'Preview changes' || 'Deploy OPT' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      OPT_HOST: ${{ secrets.OPT_DEPLOY_HOST }}
      OPT_USER: ${{ secrets.OPT_DEPLOY_USER }}
      OPT_PORT: ${{ secrets.OPT_DEPLOY_PORT }}
      OPT_PATH: ${{ secrets.OPT_DEPLOY_PATH }}
      OPT_SSH_KEY: ${{ secrets.OPT_DEPLOY_SSH_KEY }}
      OPT_KNOWN_HOSTS: ${{ secrets.OPT_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check prerequisites and configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for var in OPT_HOST OPT_USER OPT_PATH OPT_SSH_KEY OPT_KNOWN_HOSTS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${var}"
              exit 1
            fi
          done
          if [[ "${OPT_PATH}" != /* || "${OPT_PATH}" == "/" || "${OPT_PATH}" == *".."* || "${OPT_PATH}" == *[$'\n\r']* ]]; then
            echo "::error::OPT_DEPLOY_PATH must be an absolute directory, not /, and must not contain .. or line breaks"
            exit 1
          fi
          if [[ ! "${OPT_HOST}" =~ ^[a-zA-Z0-9.-]+$ || ! "${OPT_USER}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid hostname or username"
            exit 1
          fi
          OPT_PORT="${OPT_PORT:-22}"
          if [[ ! "${OPT_PORT}" =~ ^[0-9]{1,5}$ ]] || (( OPT_PORT < 1 || OPT_PORT > 65535 )); then
            echo "::error::Invalid SSH port"
            exit 1
          fi
          echo "OPT_PORT=${OPT_PORT}" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OPT_SSH_KEY" > ~/.ssh/id_opt_deploy
          printf '%s\n' "$OPT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_opt_deploy ~/.ssh/known_hosts
          unset OPT_SSH_KEY OPT_KNOWN_HOSTS
          test -f public_html/admin/m.client.php
          command -v rsync

      - name: Confirm SSH and target directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_opt_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$OPT_PORT" "$OPT_USER@$OPT_HOST" \
            "test -d '$OPT_PATH' && command -v rsync >/dev/null && test -w '$OPT_PATH'" || {
              echo "::error::Target directory is missing/not writable, or rsync is unavailable on the server"
              exit 1
            }

      - name: Preview or deploy tracked site files
        shell: bash
        run: |
          set -euo pipefail
          args=(-avz --itemize-changes --no-perms --no-owner --no-group
            --exclude='inc.db.php'
            --exclude='inc.mail.php'
            --exclude='admin/.htpasswd'
            --exclude='admin/inc.db.php'
            --exclude='.env'
            --exclude='.env.*')
          if [[ "${{ inputs.deploy_mode }}" == "preview" ]]; then
            args+=(--dry-run)
          fi
          rsync "${args[@]}" \
            -e "ssh -i $HOME/.ssh/id_opt_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -p $OPT_PORT" \
            "public_html/" "$OPT_USER@$OPT_HOST:$OPT_PATH/"

      - name: Deployment result
        run: |
          if [[ "${{ inputs.deploy_mode }}" == "preview" ]]; then
            echo "Preview completed: no files changed on server." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "File transfer completed. Application smoke test is still required." >> "$GITHUB_STEP_SUMMARY"
          fi
